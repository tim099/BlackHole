# 區塊職責：把 repo 根目錄（index.html ＋ js/）原樣部署到 GitHub Pages（Settings → Pages → Source：GitHub Actions）。
# 不建置 —— 這個網頁沒有打包步驟，檔案就是成品。
# 部署前先跑物理核心的自我測試（node js/selftest.js）：讀數跟解析值對不上 ⇒ 不部署。
# 做法比照 Blockside 的 pages.yml（GitHub 的「Static HTML」範本）。
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # 手動重跑

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # 取消到一半的部署會讓線上停在半舊狀態

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 物理核心自我測試（沒過 ⇒ 不部署）
        run: node js/selftest.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
